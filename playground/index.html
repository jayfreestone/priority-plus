<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>priority-plus playground</title>
    <link rel="stylesheet" href="playground.css" />
    <script type="module" blocking="render">
      import "../src/priorityPlus.ts";
    </script>
  </head>
  <body>
    <main>
      <h1>priority-plus playground</h1>

      <priority-plus>
        <nav class="priority-nav">
          <ul class="priority-nav__primary" data-priority-plus-primary>
            <li><a href="#">Dashboard</a></li>
            <li><a href="#">Projects</a></li>
            <li><a href="#">Roadmap</a></li>
            <li><a href="#">Customers</a></li>
            <li><a href="#">Analytics</a></li>
            <li><a href="#">Automation</a></li>
            <li><a href="#">Reports</a></li>
            <li><a href="#">Integrations</a></li>
          </ul>

          <button
            hidden
            data-priority-plus-toggle
            class="priority-nav__more"
            type="button"
            popovertarget="primary-nav-overflow"
            aria-expanded="false"
          >
            More
          </button>

          <ul
            hidden
            popover
            data-priority-plus-overflow
            id="primary-nav-overflow"
            class="priority-nav__overflow"
          ></ul>
        </nav>
      </priority-plus>
    </main>
  </body>
</html>
